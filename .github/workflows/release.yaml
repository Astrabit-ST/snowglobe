name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            ext: .exe
          - os: ubuntu-22.04
            label: linux-x86_64
            ext: ""

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Metadata
        shell: bash
        run: |
          BIN_NAME=$(cargo metadata --no-deps --format-version 1 -q \
            | jq -j '.packages[0].targets[] | select(.kind[] == "bin") | .name')
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"

      - name: (Linux) Get SDL Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
            libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked
          mv "target/release/${BIN_NAME}${{ matrix.ext }}" "target/release/${BIN_NAME}_${{ matrix.label }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}_${{ matrix.label }}${{ matrix.ext }}
          path: target/release/${{ env.BIN_NAME }}_${{ matrix.label }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true